<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jasiri Suite | Workspace</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ----- RESET & ROOT ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple-600: #6B3BC2;
            --purple-500: #8B5CF6;
            --purple-400: #A78BFA;
            --purple-100: #EDE9FE;
            --purple-50: #F5F3FF;
            --white: #FFFFFF;
            --gray-50: #FAFAFA;
            --gray-100: #F5F5F5;
            --gray-200: #E5E5E5;
            --gray-300: #D4D4D4;
            --gray-400: #A3A3A3;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-900: #171717;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gradient-primary: linear-gradient(135deg, #6B3BC2 0%, #8B5CF6 100%);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.10);
            --shadow-xl: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f6f3fc;
            color: var(--gray-900);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(circle at 20% 30%, #f0ebff 0%, #faf7ff 70%, #f0f4ff 100%);
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.20;
            filter: blur(80px);
            animation: floatShape 18s infinite alternate ease-in-out;
            will-change: transform;
        }

        .bg-shape--1 {
            width: 500px;
            height: 500px;
            background: #a78bfa;
            top: -120px;
            left: -120px;
            animation-delay: 0s;
        }

        .bg-shape--2 {
            width: 400px;
            height: 400px;
            background: #6b3bc2;
            bottom: -100px;
            right: -80px;
            animation-delay: -4s;
        }

        .bg-shape--3 {
            width: 350px;
            height: 350px;
            background: #8b5cf6;
            top: 40%;
            left: 60%;
            animation-delay: -9s;
            opacity: 0.15;
        }

        .bg-shape--4 {
            width: 280px;
            height: 280px;
            background: #c4b5fd;
            bottom: 20%;
            left: 10%;
            animation-delay: -13s;
            opacity: 0.18;
        }

        /* floating orbs – small sparkles */
        .bg-orb {
            position: absolute;
            width: 12px;
            height: 12px;
            background: rgba(139, 92, 246, 0.25);
            border-radius: 50%;
            filter: blur(4px);
            animation: twinkle 12s infinite alternate;
        }

        @keyframes floatShape {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1) rotate(6deg);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.95) rotate(-4deg);
            }
            100% {
                transform: translate(40px, 20px) scale(1.05) rotate(8deg);
            }
        }

        @keyframes twinkle {
            0% {
                opacity: 0.1;
                transform: translate(0, 0) scale(0.8);
            }
            50% {
                opacity: 0.5;
                transform: translate(30px, -20px) scale(1.4);
            }
            100% {
                opacity: 0.2;
                transform: translate(-20px, 30px) scale(0.9);
            }
        }

        /* ===== CONTENT (above background) ===== */
        .content-wrapper {
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
        }

        /* ===== TOPBAR – glassmorphism ===== */
        .topbar {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            padding: 0 1.5rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(107, 59, 194, 0.06);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: .5rem;
            text-decoration: none;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--gradient-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: .9rem;
            box-shadow: 0 4px 10px rgba(107, 59, 194, 0.25);
        }
        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .tenant-badge {
            font-size: .7rem;
            font-weight: 600;
            color: var(--purple-600);
            background: rgba(237, 233, 254, 0.7);
            backdrop-filter: blur(4px);
            padding: .2rem .7rem;
            border-radius: 50px;
            border: 1px solid rgba(167, 139, 250, 0.3);
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: .8rem;
        }
        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: .8rem;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(107, 59, 194, 0.25);
            transition: 0.2s;
        }
        .user-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 18px rgba(107, 59, 194, 0.35);
        }

        /* ===== CARDS – glass effect ===== */
        .app-tile,
        .recent-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px) saturate(160%);
            -webkit-backdrop-filter: blur(10px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 24px rgba(107, 59, 194, 0.04);
            transition: all 0.25s ease;
        }

        .app-tile:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(139, 92, 246, 0.25);
            box-shadow: 0 20px 40px rgba(107, 59, 194, 0.10);
        }

        .recent-card:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(139, 92, 246, 0.3);
        }

        /* ===== LAYOUT ===== */
        .greeting-section,
        .apps-container,
        .recent-section,
        .workspace-footer {
            position: relative;
            z-index: 2;
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
        }

        .greeting-section {
            padding: 1.5rem 2rem .5rem;
        }
        .greeting {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gray-900);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.4);
        }
        .greeting-sub {
            font-size: .85rem;
            color: var(--gray-500);
            opacity: 0.8;
        }

        .apps-container {
            padding: 1rem 2rem;
        }
        .section-label {
            font-size: .65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-400);
            margin-bottom: .8rem;
        }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: .8rem;
        }

        .app-tile {
            border-radius: 16px;
            padding: 1.4rem 1.1rem;
            text-decoration: none;
            color: var(--gray-900);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .app-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            transition: height .25s ease;
        }
        .app-tile:hover::before {
            height: 4px;
        }

        /* hub-specific accent */
        .app-tile.emh::before {
            background: linear-gradient(90deg, #6B3BC2, #A78BFA);
        }
        .app-tile.erh::before {
            background: linear-gradient(90deg, #EC4899, #F472B6);
        }
        .app-tile.efh::before {
            background: linear-gradient(90deg, #F59E0B, #FBBF24);
        }
        .app-tile.efs::before {
            background: linear-gradient(90deg, #10B981, #34D399);
        }
        .app-tile.talents::before {
            background: linear-gradient(90deg, #F97316, #FB923C);
        }
        .app-tile.ekazi::before {
            background: linear-gradient(90deg, #3B82F6, #60A5FA);
        }
        .app-tile.gmail::before {
            background: linear-gradient(90deg, #EA4335, #F4B400);
        }
        .app-tile.chat::before {
            background: linear-gradient(90deg, #34A853, #4285F4);
        }
        .app-tile.meet::before {
            background: linear-gradient(90deg, #00832D, #1A73E8);
        }
        .app-tile.drive::before {
            background: linear-gradient(90deg, #FFD04F, #34A853);
        }

        .app-icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: .8rem;
            transition: all .25s ease;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 10px;
        }
        .app-tile:hover .app-icon-wrapper {
            transform: scale(1.06);
        }
        .app-icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .app-tile h3 {
            font-size: .9rem;
            font-weight: 700;
            margin-bottom: .2rem;
        }
        .app-tile p {
            font-size: .7rem;
            color: var(--gray-500);
            line-height: 1.3;
        }
        .app-status {
            display: inline-flex;
            align-items: center;
            gap: .25rem;
            font-size: .6rem;
            font-weight: 600;
            color: var(--success);
            margin-top: .6rem;
            background: rgba(209, 250, 229, 0.6);
            backdrop-filter: blur(4px);
            padding: .15rem .5rem;
            border-radius: 50px;
            border: 1px solid rgba(16, 185, 129, 0.15);
        }
        .app-status .dot {
            width: 4px;
            height: 4px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .app-status.external {
            color: #1A73E8;
            background: rgba(219, 234, 254, 0.6);
            border-color: rgba(26, 115, 232, 0.15);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: .3
            }
        }

        /* ===== RECENT ===== */
        .recent-section {
            padding: 0 2rem 2rem;
        }
        .recent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: .6rem;
        }
        .recent-card {
            border-radius: 12px;
            padding: .8rem 1rem;
            display: flex;
            align-items: center;
            gap: .7rem;
            cursor: pointer;
            text-decoration: none;
            color: var(--gray-900);
        }
        .recent-dot {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            flex-shrink: 0;
            background: rgba(237, 233, 254, 0.5);
            backdrop-filter: blur(4px);
        }
        .recent-info {
            flex: 1;
            min-width: 0;
        }
        .recent-info h4 {
            font-size: .8rem;
            font-weight: 600;
        }
        .recent-info p {
            font-size: .65rem;
            color: var(--gray-500);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recent-time {
            font-size: .6rem;
            color: var(--gray-400);
            white-space: nowrap;
        }

        .workspace-footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--gray-400);
            font-size: .7rem;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* ===== DROPDOWN ===== */
        .user-menu {
            position: relative;
        }
        .dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: .5rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 14px;
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.6);
            min-width: 220px;
            padding: .4rem;
            display: none;
            z-index: 200;
        }
        .dropdown.active {
            display: block;
            animation: fadeDown .15s ease;
        }
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .dropdown-header {
            padding: .8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: .3rem;
        }
        .dropdown-header .name {
            font-weight: 700;
            font-size: .85rem;
        }
        .dropdown-header .email {
            font-size: .7rem;
            color: var(--gray-500);
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .6rem 1rem;
            color: var(--gray-700);
            text-decoration: none;
            font-size: .8rem;
            border-radius: 8px;
            transition: all .15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }
        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.6);
            color: var(--gray-900);
        }
        .dropdown-item.signout {
            color: var(--danger);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: .3rem;
            padding-top: .7rem;
        }
        .dropdown-item.signout:hover {
            background: #FEF2F2;
        }

        /* ===== E-KAZI MODAL ===== */
        .ekazi-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 9999;
            animation: fadeIn .2s ease;
            flex-direction: column;
        }
        .ekazi-modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .ekazi-modal-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 0 1.5rem;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .ekazi-modal-header h3 {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ekazi-modal-header h3 img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .ekazi-close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--gray-600);
            transition: all .2s;
        }
        .ekazi-close-btn:hover {
            background: #FEE2E2;
            color: var(--danger);
        }
        .ekazi-modal-body {
            flex: 1;
            background: white;
        }
        .ekazi-modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .apps-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: .6rem;
            }
            .app-tile {
                padding: 1.1rem .8rem;
            }
            .app-icon-wrapper {
                width: 50px;
                height: 50px;
                padding: 7px;
                border-radius: 12px;
            }
            .app-tile h3 {
                font-size: .78rem;
            }
            .app-tile p {
                font-size: .65rem;
            }
            .greeting {
                font-size: 1.2rem;
            }
            .tenant-badge {
                display: none;
            }
            .recent-grid {
                grid-template-columns: 1fr;
            }
            .greeting-section,
            .apps-container,
            .recent-section {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .bg-shape--1 {
                width: 300px;
                height: 300px;
                top: -80px;
                left: -80px;
            }
            .bg-shape--2 {
                width: 250px;
                height: 250px;
                bottom: -60px;
                right: -60px;
            }
            .bg-shape--3 {
                width: 200px;
                height: 200px;
                top: 50%;
                left: 70%;
            }
            .bg-shape--4 {
                width: 180px;
                height: 180px;
                bottom: 15%;
                left: 5%;
            }
        }
    </style>
</head>

<body>

    <!-- ===== ANIMATED BACKGROUND ===== -->
    <div class="bg-canvas" aria-hidden="true">
        <div class="bg-shape bg-shape--1"></div>
        <div class="bg-shape bg-shape--2"></div>
        <div class="bg-shape bg-shape--3"></div>
        <div class="bg-shape bg-shape--4"></div>
        <div class="bg-orb" style="top:15%; left:80%; animation-delay:0s;"></div>
        <div class="bg-orb" style="top:70%; left:10%; animation-delay:-3s; width:18px; height:18px;"></div>
        <div class="bg-orb" style="top:40%; left:25%; animation-delay:-7s; width:10px; height:10px;"></div>
        <div class="bg-orb" style="top:85%; left:70%; animation-delay:-11s; width:20px; height:20px;"></div>
        <div class="bg-orb" style="top:10%; left:40%; animation-delay:-15s; width:8px; height:8px;"></div>
    </div>

    <!-- ===== CONTENT ===== -->
    <div class="content-wrapper">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <a href="/" class="logo">
                    <div class="logo-icon">J</div>
                    <span class="logo-text">Jasiri</span>
                </a>
                <span class="tenant-badge" id="tenantBadge">Loading...</span>
            </div>
            <div class="topbar-right">
                <div class="user-menu">
                    <div class="user-avatar" id="userAvatar" onclick="toggleDropdown()">
                        <span id="avatarInitials">U</span>
                    </div>
                    <div class="dropdown" id="userDropdown">
                        <div class="dropdown-header">
                            <div class="name" id="dropdownName">User</div>
                            <div class="email" id="dropdownEmail">email</div>
                        </div>
                        <a href="/admin/index.html" class="dropdown-item"><i class="fas fa-cog"></i> Admin Hub</a>
                        <a href="manage-team.html" class="dropdown-item"><i class="fas fa-users"></i> Manage Team</a>
                        <a href="templates.html" class="dropdown-item"><i class="fas fa-file-excel"></i> Templates</a>
                        <button class="dropdown-item signout" onclick="handleSignOut()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- GREETING -->
        <div class="greeting-section">
            <h1 class="greeting" id="greetingText">Good morning</h1>
            <p class="greeting-sub">Choose a hub to start working</p>
        </div>

        <!-- BUSINESS HUBS -->
        <div class="apps-container">
            <div class="section-label">Your Business Hubs</div>
            <div class="apps-grid" id="appsGrid"></div>
        </div>

        <!-- GOOGLE WORKSPACE -->
        <div class="apps-container">
            <div class="section-label">Google Workspace Tools</div>
            <div class="apps-grid" id="googleAppsGrid"></div>
        </div>

        <!-- QUICK ACCESS -->
        <div class="recent-section">
            <div class="section-label">Quick Access</div>
            <div class="recent-grid" id="recentGrid"></div>
        </div>

        <div class="workspace-footer"><p>&copy; 2026 Jasiri Suite.</p></div>
    </div>

    <!-- E-KAZI MODAL -->
    <div class="ekazi-modal-overlay" id="ekaziModal">
        <div class="ekazi-modal-header">
            <h3>
                <img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png" alt="E-KAZI" onerror="this.style.display='none'" />
                🔷 E-KAZI Platform
            </h3>
            <button class="ekazi-close-btn" onclick="closeEkazi()"><i class="fas fa-times"></i></button>
        </div>
        <div class="ekazi-modal-body">
            <iframe id="ekaziIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const fc = {
            apiKey: "AIzaSyC4GYjju0-ckHraZ3H5qR3MkID_BWoYQXk",
            authDomain: "jasiri-suite.firebaseapp.com",
            databaseURL: "https://jasiri-suite-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "jasiri-suite",
            storageBucket: "jasiri-suite.firebasestorage.app",
            messagingSenderId: "414625239065",
            appId: "1:414625239065:web:8cc055fd20d3d66a8e5a88"
        };
        const app = initializeApp(fc);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const up = new URLSearchParams(location.search);
        const urlTenant = up.get('tenant');
        let activeTenant = urlTenant || '';

        const allHubs = [
            { id: 'emh', name: 'Sales Hub', desc: 'Sales, POS & Analytics', icon: 'https://i.postimg.cc/BbZ5c1Tv/20260119-1500-Image-Generation-remix-01kfb1znpceyc8d9dztq9ea0y3-1-removebg-preview-1.png', cc: 'emh', fi: 'fa-store', ic: '#6B3BC2', url: 'emh-workspace.html' },
            { id: 'erh', name: 'Resource Hub', desc: 'HR, Assets & Projects', icon: 'https://i.postimg.cc/3rFrpW8P/20260112-1839-Image-Generation-remix-01kesdpw6ce8s88amr0e92g276-removebg-preview-removebg-preview.png', cc: 'erh', fi: 'fa-users-cog', ic: '#EC4899', url: 'erh-workspace.html' },
            { id: 'efh', name: 'Finance Hub', desc: 'Accounting & Budgets', icon: 'https://i.postimg.cc/nLkCKS3J/20260119-1502-Image-Generation-remix-01kfb24hnje88t8jgrmchg3m4w-1-removebg-preview.png', cc: 'efh', fi: 'fa-chart-pie', ic: '#F59E0B', url: 'efh-workspace.html' },
            { id: 'efs', name: 'Fleet Hub', desc: 'Logistics & Shipping', icon: 'https://i.postimg.cc/MTYB3K5P/20260119-1531-Image-Generation-remix-01kfb3rnfzfzxt9rhe0336w04w-1-removebg-preview.png', cc: 'efs', fi: 'fa-truck', ic: '#10B981', url: 'efs-workspace.html' },
            { id: 'talents', name: 'Talents Hub', desc: 'HR & Learning', icon: 'https://i.postimg.cc/wvFVykC1/20260119-1539-Image-Generation-remix-01kfb488qbfhz9a354vdfwrwva-1-removebg-preview.png', cc: 'talents', fi: 'fa-graduation-cap', ic: '#F97316', url: 'talents-workspace.html' }
        ];

        const googleTools = [
            { id: 'gmail', name: 'Gmail', desc: 'Email & Communications', icon: 'https://i.postimg.cc/ZqPwy2Vr/gmail.webp', cc: 'gmail', url: 'https://mail.google.com' },
            { id: 'chat', name: 'Google Chat', desc: 'Team Messaging', icon: 'https://i.postimg.cc/C5nDbfSs/Google-Chat-icon-2023-svg.webp', cc: 'chat', url: 'https://chat.google.com' },
            { id: 'meet', name: 'Google Meet', desc: 'Video Meetings', icon: 'https://i.postimg.cc/c1tXRv9x/meet.webp', cc: 'meet', url: 'https://meet.google.com' },
            { id: 'drive', name: 'Google Drive', desc: 'Cloud Storage & Files', icon: 'https://i.postimg.cc/9QLd5286/google-drive.webp', cc: 'drive', url: 'https://drive.google.com' }
        ];

        // E-KAZI modal
        window.openEkazi = function(tid) {
            document.getElementById('ekaziIframe').src = 'https://kazinni-staff.vercel.app';
            document.getElementById('ekaziModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        };
        window.closeEkazi = function() {
            document.getElementById('ekaziModal').classList.remove('active');
            document.getElementById('ekaziIframe').src = '';
            document.body.style.overflow = '';
        };
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEkazi(); });

        function sg(n) {
            const h = new Date().getHours();
            let g = 'Good ';
            if (h < 12) g += 'morning';
            else if (h < 17) g += 'afternoon';
            else g += 'evening';
            document.getElementById('greetingText').textContent = n ? `${g}, ${n}` : g;
        }

        window.toggleDropdown = () => document.getElementById('userDropdown').classList.toggle('active');
        document.addEventListener('click', e => {
            const d = document.getElementById('userDropdown'),
                a = document.getElementById('userAvatar');
            if (d && a && !a.contains(e.target) && !d.contains(e.target)) d.classList.remove('active');
        });
        window.handleSignOut = async () => { await signOut(auth);
            location.href = 'index.html'; };

        function renderAllApps(tid) {
            const g = document.getElementById('appsGrid');
            g.innerHTML = allHubs.map(hub => `
                    <a href="${hub.url}?tenant=${tid}" class="app-tile ${hub.cc}">
                        <div class="app-icon-wrapper"><img src="${hub.icon}" alt="${hub.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fas ${hub.fi}\\' style=\\'font-size:1.6rem;color:${hub.ic}\\'></i>'" /></div>
                        <h3>${hub.name}</h3><p>${hub.desc}</p>
                        <div class="app-status"><span class="dot"></span> Live</div>
                    </a>
                `).join('');

            g.innerHTML += `
                    <a href="#" onclick="openEkazi('${tid}');return false" class="app-tile ekazi">
                        <div class="app-icon-wrapper"><img src="https://i.postimg.cc/rFfXDj3L/kazinni-removebg-preview-1.png" alt="E-KAZI" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fas fa-tasks\\' style=\\'font-size:1.6rem;color:#3B82F6\\'></i>'" /></div>
                        <h3>E-KAZI</h3><p>Freelance Task Platform</p>
                        <div class="app-status"><span class="dot"></span> Available</div>
                    </a>`;

            const gg = document.getElementById('googleAppsGrid');
            gg.innerHTML = googleTools.map(t => `
                    <a href="${t.url}" target="_blank" rel="noopener" class="app-tile ${t.cc}">
                        <div class="app-icon-wrapper"><img src="${t.icon}" alt="${t.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fas fa-external-link-alt\\' style=\\'font-size:1.6rem;color:#4285F4\\'></i>'" /></div>
                        <h3>${t.name}</h3><p>${t.desc}</p>
                        <div class="app-status external"><i class="fas fa-external-link-alt"></i> Open</div>
                    </a>
                `).join('');
        }

        function renderRecent(tid) {
            document.getElementById('recentGrid').innerHTML = `
                <a href="emh-workspace.html?tenant=${tid}" class="recent-card"><div class="recent-dot" style="background:rgba(237,233,254,0.6)"><i class="fas fa-store" style="color:#6B3BC2"></i></div><div class="recent-info"><h4>Sales Hub</h4><p>Point of Sale & Analytics</p></div><span class="recent-time">→</span></a>
                <a href="erh-workspace.html?tenant=${tid}" class="recent-card"><div class="recent-dot" style="background:rgba(252,231,243,0.6)"><i class="fas fa-users-cog" style="color:#EC4899"></i></div><div class="recent-info"><h4>Resource Hub</h4><p>HR & Asset Management</p></div><span class="recent-time">→</span></a>
                <a href="templates.html?tenant=${tid}" class="recent-card"><div class="recent-dot" style="background:rgba(209,250,229,0.6)"><i class="fas fa-file-excel" style="color:#10B981"></i></div><div class="recent-info"><h4>Sheet Templates</h4><p>Ready-to-use templates</p></div><span class="recent-time">→</span></a>
                <a href="efh-workspace.html?tenant=${tid}" class="recent-card"><div class="recent-dot" style="background:rgba(254,243,199,0.6)"><i class="fas fa-chart-pie" style="color:#F59E0B"></i></div><div class="recent-info"><h4>Finance Hub</h4><p>Accounting & Budgets</p></div><span class="recent-time">→</span></a>
            `;
        }

        onAuthStateChanged(auth, async user => {
            if (!user) { location.href = 'index.html'; return; }
            const dn = user.displayName || user.email?.split('@')[0] || 'User';
            document.getElementById('avatarInitials').textContent = dn.substring(0, 2).toUpperCase();
            document.getElementById('dropdownName').textContent = dn;
            document.getElementById('dropdownEmail').textContent = user.email;
            sg(dn.split(' ')[0]);

            if (!activeTenant) {
                const us = await get(ref(db, `users/${user.uid}/tenants`));
                if (us.exists()) activeTenant = Object.keys(us.val())[0];
            }
            if (activeTenant) {
                const ts = await get(ref(db, `tenants/${activeTenant}/info`));
                document.getElementById('tenantBadge').textContent = ts.exists() ? ts.val().name : 'My Workspace';
            }
            renderAllApps(activeTenant || '');
            renderRecent(activeTenant || '');
        });
    </script>
</body>
</html>
