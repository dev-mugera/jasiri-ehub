<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasiri Suite | Billing & Subscription</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --purple-600: #6B3BC2; --purple-500: #8B5CF6; --purple-400: #A78BFA;
            --purple-100: #EDE9FE; --purple-50: #F5F3FF; --white: #FFFFFF;
            --gray-50: #FAFAFA; --gray-100: #F5F5F5; --gray-200: #E5E5E5;
            --gray-300: #D4D4D4; --gray-400: #A3A3A3; --gray-500: #737373;
            --gray-600: #525252; --gray-700: #404040; --gray-900: #171717;
            --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
            --gradient-primary: linear-gradient(135deg, #6B3BC2 0%, #8B5CF6 100%);
            --shadow-sm: 0 1px 3px rgba(107,59,194,0.06);
            --shadow-md: 0 4px 16px rgba(107,59,194,0.10);
            --shadow-lg: 0 12px 40px rgba(107,59,194,0.15);
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:linear-gradient(180deg,var(--purple-50) 0%,var(--white) 100%);color:var(--gray-900);min-height:100vh}
        
        .topbar{background:white;border-bottom:1px solid var(--purple-100);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .topbar-left{display:flex;align-items:center;gap:1rem}
        .back-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--purple-100);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gray-700);transition:all .2s;text-decoration:none}
        .back-btn:hover{background:var(--purple-50);border-color:var(--purple-300);color:var(--purple-600)}
        .app-title h1{font-size:1rem;font-weight:700}
        .tenant-badge{font-size:.7rem;font-weight:600;color:var(--purple-600);background:var(--purple-50);padding:.2rem .7rem;border-radius:50px;border:1px solid var(--purple-100)}
        .topbar-right{display:flex;align-items:center;gap:.8rem}
        .user-avatar{width:34px;height:34px;border-radius:50%;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.8rem;cursor:pointer}

        .container{max-width:1000px;margin:0 auto;padding:24px}

        .page-header{background:white;border-radius:18px;padding:24px 28px;margin-bottom:24px;border:1px solid var(--purple-100);box-shadow:var(--shadow-sm)}
        .page-header h2{font-size:22px;font-weight:800;margin-bottom:4px}
        .page-header p{font-size:13px;color:var(--gray-500)}

        /* Current Plan Card */
        .current-plan{background:white;border-radius:18px;padding:28px;margin-bottom:24px;border:1px solid var(--purple-100);box-shadow:var(--shadow-sm)}
        .plan-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:16px}
        .plan-name{font-size:20px;font-weight:800}
        .plan-price{font-size:32px;font-weight:900;color:var(--purple-600)}
        .plan-price span{font-size:14px;font-weight:500;color:var(--gray-500)}
        .plan-badge-big{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700}
        .badge-free{background:var(--gray-100);color:var(--gray-600)}
        .badge-pro{background:#EDE9FE;color:#5B21B6}
        .badge-enterprise{background:var(--gradient-primary);color:white}
        .plan-limits-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px}
        .limit-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-600)}
        .limit-item i{color:var(--purple-500)}
        .limit-item strong{color:var(--gray-900)}
        .progress-bar{width:100%;height:8px;background:var(--gray-100);border-radius:10px;overflow:hidden;margin-bottom:6px}
        .progress-fill{height:100%;background:var(--gradient-primary);border-radius:10px;transition:width .5s ease}
        .progress-label{font-size:11px;color:var(--gray-500);text-align:right}

        /* Pricing Cards */
        .pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:24px}
        .pricing-card{background:white;border-radius:18px;padding:28px 24px;border:2px solid var(--purple-100);text-align:center;transition:all .3s ease;position:relative;cursor:pointer}
        .pricing-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--purple-300)}
        .pricing-card.current{border-color:var(--purple-500);background:var(--purple-50)}
        .pricing-card.popular{border-color:var(--purple-500);box-shadow:var(--shadow-md)}
        .popular-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--gradient-primary);color:white;padding:5px 18px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
        .current-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--success);color:white;padding:5px 18px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
        .pricing-icon{font-size:36px;margin-bottom:12px}
        .pricing-name{font-size:18px;font-weight:800;margin-bottom:4px}
        .pricing-price{font-size:28px;font-weight:900;color:var(--purple-600);margin-bottom:4px}
        .pricing-price span{font-size:13px;font-weight:500;color:var(--gray-500)}
        .pricing-desc{font-size:12px;color:var(--gray-500);margin-bottom:16px}
        .pricing-features{list-style:none;text-align:left;margin-bottom:20px}
        .pricing-features li{padding:6px 0;font-size:12px;color:var(--gray-700);display:flex;align-items:flex-start;gap:8px}
        .pricing-features li i{color:var(--success);margin-top:2px;flex-shrink:0}
        .pricing-features li.disabled{color:var(--gray-400)}
        .pricing-features li.disabled i{color:var(--gray-300)}
        .btn{width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;border:none;font-family:'Inter',sans-serif}
        .btn-primary{background:var(--gradient-primary);color:white}
        .btn-primary:hover{opacity:.9;transform:translateY(-1px)}
        .btn-outline{background:white;border:2px solid var(--purple-100);color:var(--gray-700)}
        .btn-outline:hover{background:var(--purple-50);border-color:var(--purple-300)}
        .btn-current{background:var(--success);color:white;cursor:default}
        .btn-current:hover{opacity:1;transform:none}

        /* Payment History */
        .payment-history{background:white;border-radius:18px;padding:24px;border:1px solid var(--purple-100);box-shadow:var(--shadow-sm)}
        .section-title{font-size:16px;font-weight:700;margin-bottom:16px}
        .payment-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--purple-50);font-size:13px}
        .payment-row:last-child{border-bottom:none}
        .payment-status{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700}
        .status-paid{background:#D1FAE5;color:#065F46}
        .status-pending{background:#FEF3C7;color:#92400E}

        .empty-state{text-align:center;padding:40px;color:var(--gray-400)}
        .empty-state i{font-size:36px;margin-bottom:8px;opacity:.4}

        .toast{position:fixed;bottom:24px;right:24px;background:white;border:1px solid var(--purple-100);border-radius:10px;padding:14px 22px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);transform:translateX(120%);transition:transform .3s ease;z-index:2000}
        .toast.show{transform:translateX(0)}
        .toast.success{border-left:4px solid var(--success)}
        .toast i{font-size:18px;color:var(--success)}

        @media(max-width:768px){.container{padding:16px}.plan-limits-row{flex-direction:column;gap:12px}.pricing-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <a href="admin.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="app-title"><h1>💳 Billing & Subscription</h1></div>
        <span class="tenant-badge" id="tenantBadge">Loading...</span>
    </div>
    <div class="topbar-right">
        <div class="user-avatar" id="userAvatar" onclick="toggleDropdown()"><span id="avatarInitials">U</span></div>
        <div id="userDropdown" style="display:none;position:absolute;top:56px;right:16px;background:white;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,0.15);border:1px solid var(--purple-100);min-width:200px;padding:8px;z-index:200;">
            <div style="padding:10px 14px;border-bottom:1px solid var(--purple-50);margin-bottom:4px;"><div style="font-weight:700;font-size:13px;" id="dropdownName">User</div><div style="font-size:11px;color:var(--gray-500);" id="dropdownEmail">email</div></div>
            <a href="workspace.html" style="display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--gray-700);text-decoration:none;font-size:13px;border-radius:8px;">🏠 Workspace</a>
            <button onclick="handleSignOut()" style="display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--danger);background:none;border:none;width:100%;text-align:left;font-size:13px;cursor:pointer;border-radius:8px;margin-top:4px;border-top:1px solid var(--purple-50);font-family:'Inter',sans-serif;">🚪 Sign Out</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="page-header"><h2>💳 Subscription Management</h2><p>Manage your plan, view usage, and upgrade anytime.</p></div>

    <!-- Current Plan -->
    <div class="current-plan" id="currentPlanCard">
        <div class="plan-header">
            <div>
                <div class="plan-name" id="currentPlanName">Free Plan</div>
                <span class="plan-badge-big badge-free" id="currentPlanBadge">FREE</span>
            </div>
            <div class="plan-price" id="currentPlanPrice">KSh 0<span>/month</span></div>
        </div>
        <div class="plan-limits-row" id="planLimits"></div>
        <div id="usageSection"></div>
    </div>

    <!-- Pricing Cards -->
    <div class="section-title" style="font-size:18px;margin-bottom:16px;">📦 Available Plans</div>
    <div class="pricing-grid" id="pricingGrid"></div>

    <!-- Payment History -->
    <div class="payment-history">
        <div class="section-title">📋 Payment History</div>
        <div id="paymentHistory">
            <div class="empty-state"><i class="fas fa-receipt"></i><p>No payments yet — you're on the Free plan</p></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage"></span></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getDatabase,ref,get,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const fc={apiKey:"AIzaSyC4GYjju0-ckHraZ3H5qR3MkID_BWoYQXk",authDomain:"jasiri-suite.firebaseapp.com",databaseURL:"https://jasiri-suite-default-rtdb.europe-west1.firebasedatabase.app",projectId:"jasiri-suite",storageBucket:"jasiri-suite.firebasestorage.app",messagingSenderId:"414625239065",appId:"1:414625239065:web:8cc055fd20d3d66a8e5a88"};
const app=initializeApp(fc),auth=getAuth(app),db=getDatabase(app);
const up=new URLSearchParams(location.search);
let tid=up.get('tenant')||'',tp='free',tLimits={},memberCount=0;

const plans={
    free:{name:'Free',price:0,icon:'🆓',badge:'badge-free',desc:'For individuals & small teams',features:['Up to 3 team members','5 Google Sheets','2 hubs (Sales & Resource)','E-KAZI: 3 tasks/day','Community support'],limits:{maxUsers:3,maxSheets:5,hubs:2,ekazi:3}},
    pro:{name:'Professional',price:850,icon:'⭐',badge:'badge-pro',desc:'For growing businesses',popular:true,features:['Up to 15 team members','Unlimited Google Sheets','All 5 business hubs','E-KAZI: 25 tasks/day','Custom branding','Priority email support'],limits:{maxUsers:15,maxSheets:Infinity,hubs:5,ekazi:25}},
    enterprise:{name:'Enterprise',price:1200,icon:'👑',badge:'badge-enterprise',desc:'For organizations',features:['Unlimited team members','Unlimited Google Sheets','All 5 hubs + custom','E-KAZI: Unlimited','Full custom branding','API access','Dedicated support & SLA'],limits:{maxUsers:Infinity,maxSheets:Infinity,hubs:Infinity,ekazi:Infinity}}
};

window.toggleDropdown=()=>{const d=document.getElementById('userDropdown');d.style.display=d.style.display==='none'?'block':'none'};
document.addEventListener('click',e=>{const d=document.getElementById('userDropdown'),a=document.getElementById('userAvatar');if(d&&a&&!a.contains(e.target)&&!d.contains(e.target))d.style.display='none'});
window.handleSignOut=async()=>{await signOut(auth);location.href='index.html'};
function st(m){const t=document.getElementById('toast');document.getElementById('toastMessage').textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

function renderCurrentPlan(){
    const p=plans[tp]||plans.free;
    document.getElementById('currentPlanName').textContent=p.name+' Plan';
    document.getElementById('currentPlanBadge').textContent=tp.toUpperCase();
    document.getElementById('currentPlanBadge').className=`plan-badge-big ${p.badge}`;
    document.getElementById('currentPlanPrice').innerHTML=tp==='free'?'KSh 0<span>/month</span>':`KSh ${p.price}<span>/month</span>`;

    const ml=tp==='free'?3:tp==='pro'?15:'∞';
    const ms=tp==='free'?5:'∞';
    const hu=tp==='free'?2:5;
    const ek=tp==='free'?'3/day':tp==='pro'?'25/day':'Unlimited';

    document.getElementById('planLimits').innerHTML=`
        <div class="limit-item"><i class="fas fa-users"></i> <strong>${memberCount}/${ml}</strong> Members</div>
        <div class="limit-item"><i class="fas fa-link"></i> <strong>${ms}</strong> Sheets</div>
        <div class="limit-item"><i class="fas fa-layer-group"></i> <strong>${hu}</strong> Hubs</div>
        <div class="limit-item"><i class="fas fa-tasks"></i> <strong>${ek}</strong> E-KAZI</div>`;

    if(tp==='free'){
        const upct=Math.min((memberCount/3)*100,100);
        document.getElementById('usageSection').innerHTML=`
            <div class="progress-bar"><div class="progress-fill" style="width:${upct}%"></div></div>
            <div class="progress-label">${memberCount}/3 members used</div>`;
        document.getElementById('currentPlanCard').style.borderColor='var(--purple-100)';
    }else{
        document.getElementById('usageSection').innerHTML='';
        document.getElementById('currentPlanCard').style.borderColor=tp==='pro'?'var(--purple-500)':'var(--warning)';
    }
}

function renderPricing(){
    document.getElementById('pricingGrid').innerHTML=Object.entries(plans).map(([k,p])=>{
        const isCurrent=tp===k;
        return`<div class="pricing-card${p.popular?' popular':''}${isCurrent?' current':''}">
            ${p.popular&&!isCurrent?'<div class="popular-badge">Most Popular</div>':''}
            ${isCurrent?'<div class="current-badge">Current Plan</div>':''}
            <div class="pricing-icon">${p.icon}</div>
            <div class="pricing-name">${p.name}</div>
            <div class="pricing-price">${k==='free'?'KSh 0':`KSh ${p.price}`}<span>/month</span></div>
            <p class="pricing-desc">${p.desc}</p>
            <ul class="pricing-features">${p.features.map(f=>`<li><i class="fas fa-check"></i> ${f}</li>`).join('')}</ul>
            ${isCurrent?`<button class="btn btn-current"><i class="fas fa-check"></i> Current Plan</button>`:
            k==='free'?`<button class="btn btn-outline" onclick="downgradePlan('free')">Switch to Free</button>`:
            `<button class="btn btn-primary" onclick="upgradePlan('${k}')"><i class="fas fa-arrow-up"></i> Upgrade to ${p.name}</button>`}
        </div>`;
    }).join('');
}

window.upgradePlan=async(plan)=>{
    if(!confirm(`Upgrade to ${plans[plan].name} plan for KSh ${plans[plan].price}/month?`))return;
    try{
        await update(ref(db,`tenants/${tid}/subscription`),{plan,status:'active',updatedAt:new Date().toISOString(),limits:plans[plan].limits});
        tp=plan;
        renderCurrentPlan();
        renderPricing();
        document.getElementById('paymentHistory').innerHTML=`
            <div class="payment-row"><span>📅 ${new Date().toLocaleDateString()}</span><span>${plans[plan].name} Plan</span><span>KSh ${plans[plan].price}</span><span class="payment-status status-pending">PENDING</span></div>
            <div class="empty-state" style="padding:16px"><i class="fas fa-info-circle"></i><p>Payment processing — M-Pesa integration coming soon</p></div>`;
        st(`Upgraded to ${plans[plan].name}!`);
    }catch(e){st('Error: '+e.message)}
};

window.downgradePlan=async(plan)=>{
    if(!confirm('Switch to Free plan? Some features will be limited.'))return;
    try{
        await update(ref(db,`tenants/${tid}/subscription`),{plan,status:'active',updatedAt:new Date().toISOString(),limits:plans[plan].limits});
        tp=plan;
        renderCurrentPlan();
        renderPricing();
        document.getElementById('paymentHistory').innerHTML='<div class="empty-state"><i class="fas fa-receipt"></i><p>No payments — Free plan</p></div>';
        st('Switched to Free plan');
    }catch(e){st('Error: '+e.message)}
};

onAuthStateChanged(auth,async user=>{
    if(!user){location.href='index.html';return}
    const dn=user.displayName||user.email?.split('@')[0]||'User';
    document.getElementById('avatarInitials').textContent=dn.substring(0,2).toUpperCase();
    document.getElementById('dropdownName').textContent=dn;
    document.getElementById('dropdownEmail').textContent=user.email;

    if(!tid){const us=await get(ref(db,`users/${user.uid}/tenants`));if(us.exists())tid=Object.keys(us.val())[0]}
    if(tid){
        const ts=await get(ref(db,`tenants/${tid}/info`));
        document.getElementById('tenantBadge').textContent=ts.exists()?ts.val().name:'My Workspace';
        const ss=await get(ref(db,`tenants/${tid}/subscription`));
        if(ss.exists()){tp=ss.val().plan||'free';tLimits=ss.val().limits||{}}
        const ms=await get(ref(db,`tenants/${tid}/members`));
        memberCount=ms.exists()?Object.keys(ms.val()).length:0;
        renderCurrentPlan();
        renderPricing();
    }
});
</script>
</body>
</html>
