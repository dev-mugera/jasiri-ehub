<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasiri Suite | Sales Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-900: #1a0a2e;
            --purple-800: #2d1154;
            --purple-700: #3d1a6e;
            --purple-600: #6B3BC2;
            --purple-500: #8B5CF6;
            --purple-400: #A78BFA;
            --purple-300: #C4B5FD;
            --purple-200: #DDD6FE;
            --purple-100: #EDE9FE;
            --purple-50: #F5F3FF;
            --white: #FFFFFF;
            --gray-50: #FAFAFA;
            --gray-100: #F5F5F5;
            --gray-200: #E5E5E5;
            --gray-300: #D4D4D4;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-900: #171717;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gradient-primary: linear-gradient(135deg, #6B3BC2 0%, #8B5CF6 100%);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FAFBFC;
            color: var(--gray-900);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Bar */
        .topbar {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            padding: 0 1.5rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--gray-200);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray-700);
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--purple-50);
            border-color: var(--purple-300);
            color: var(--purple-600);
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .app-icon {
            width: 32px; height: 32px;
            background: var(--purple-100);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple-600);
            font-size: 0.9rem;
        }

        .app-title h1 {
            font-size: 1rem;
            font-weight: 700;
        }

        .tenant-badge {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--purple-600);
            background: var(--purple-50);
            padding: 0.2rem 0.7rem;
            border-radius: 50px;
            border: 1px solid var(--purple-100);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .user-avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .user-menu {
            position: relative;
        }

        .dropdown {
            position: absolute;
            top: 100%; right: 0;
            margin-top: 0.5rem;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid var(--gray-200);
            min-width: 220px;
            padding: 0.5rem;
            display: none;
            z-index: 200;
        }

        .dropdown.active { display: block; }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 1rem;
            color: var(--gray-700);
            text-decoration: none;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .dropdown-item:hover { background: var(--gray-50); }
        .dropdown-item.signout { color: var(--danger); }

        /* Main Content */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }

        .greeting {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .tool-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--gray-200);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--gray-900);
            display: flex;
            flex-direction: column;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--purple-300);
        }

        .tool-card::before {
            content: '';
            height: 3px;
            background: var(--gradient-primary);
            border-radius: 3px 3px 0 0;
            margin: -1.5rem -1.5rem 1rem -1.5rem;
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .tool-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: var(--purple-50);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple-600);
            font-size: 1.1rem;
        }

        .tool-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .tool-info .badge {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--success);
            background: #D1FAE5;
            padding: 0.15rem 0.6rem;
            border-radius: 50px;
        }

        .tool-description {
            font-size: 0.82rem;
            color: var(--gray-600);
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            grid-column: 1 / -1;
            color: var(--gray-500);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }

        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            gap: 0.8rem;
            color: var(--purple-600);
            grid-column: 1 / -1;
        }

        .loader {
            width: 24px; height: 24px;
            border: 3px solid var(--purple-200);
            border-top-color: var(--purple-600);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Sheet Modal */
        .sheet-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            flex-direction: column;
        }

        .sheet-overlay.active { display: flex; }

        .sheet-header {
            background: white;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-200);
        }

        .sheet-header h3 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .sheet-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--gray-200);
            background: white;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover { background: var(--gray-50); }
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { color: var(--danger); border-color: #FECACA; }
        .btn-danger:hover { background: #FEF2F2; }

        .sheet-iframe-container {
            flex: 1;
            background: white;
        }

        .sheet-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .main-container { padding: 1rem; }
            .tools-grid { grid-template-columns: 1fr; }
            .tenant-badge { display: none; }
        }
    </style>
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
    <div class="topbar-left">
        <a href="workspace.html" class="back-btn" title="Back to Workspace">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="app-title">
            <div class="app-icon">
                <i class="fas fa-store"></i>
            </div>
            <h1>Sales Hub</h1>
        </div>
        <span class="tenant-badge" id="tenantBadge">Loading...</span>
    </div>
    <div class="topbar-right">
        <div class="user-menu">
            <div class="user-avatar" id="userAvatar" onclick="toggleDropdown()">
                <span id="avatarInitials">U</span>
            </div>
            <div class="dropdown" id="userDropdown">
                <div style="padding: 0.8rem 1rem; border-bottom: 1px solid var(--gray-200); margin-bottom: 0.3rem;">
                    <div style="font-weight: 700; font-size: 0.85rem;" id="dropdownName">User</div>
                    <div style="font-size: 0.7rem; color: var(--gray-500);" id="dropdownEmail">email</div>
                </div>
                <a href="workspace.html" class="dropdown-item">
                    <i class="fas fa-th-large"></i> Workspace
                </a>
                <button class="dropdown-item signout" onclick="handleSignOut()">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </button>
            </div>
        </div>
    </div>
</header>

<!-- Main Content -->
<div class="main-container">
    <div class="greeting" id="greeting">Good morning</div>
    <div class="tools-grid" id="toolsGrid">
        <div class="loading-state">
            <div class="loader"></div>
            <span>Loading tools...</span>
        </div>
    </div>
</div>

<!-- Sheet Viewer Overlay -->
<div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet-header">
        <h3 id="sheetTitle">Google Sheet</h3>
        <div class="sheet-actions">
            <button class="btn" onclick="toggleEditMode()" id="editToggleBtn">
                <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn" onclick="reloadSheet()">
                <i class="fas fa-redo"></i> Refresh
            </button>
            <button class="btn btn-danger" onclick="closeSheet()">
                <i class="fas fa-times"></i> Close
            </button>
        </div>
    </div>
    <div class="sheet-iframe-container">
        <iframe id="sheetIframe" src="" allowfullscreen></iframe>
    </div>
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC4GYjju0-ckHraZ3H5qR3MkID_BWoYQXk",
        authDomain: "jasiri-suite.firebaseapp.com",
        databaseURL: "https://jasiri-suite-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "jasiri-suite",
        storageBucket: "jasiri-suite.firebasestorage.app",
        messagingSenderId: "414625239065",
        appId: "1:414625239065:web:8cc055fd20d3d66a8e5a88"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const tenantId = urlParams.get('tenant');

    let currentEditMode = false;

    // Toggle dropdown
    window.toggleDropdown = () => {
        document.getElementById('userDropdown').classList.toggle('active');
    };

    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('userDropdown');
        const avatar = document.getElementById('userAvatar');
        if (dropdown && avatar && !avatar.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.remove('active');
        }
    });

    // Sign out
    window.handleSignOut = async () => {
        await signOut(auth);
        window.location.href = 'index.html';
    };

    // Load tools
    async function loadTools(tenant) {
        const grid = document.getElementById('toolsGrid');
        grid.innerHTML = '<div class="loading-state"><div class="loader"></div><span>Loading tools...</span></div>';

        try {
            const toolsSnap = await get(ref(db, `tenants/${tenant}/apps/ehub/tools`));
            
            if (!toolsSnap.exists()) {
                // Try templates as fallback
                const templateSnap = await get(ref(db, 'templates/enterpriseHub/tools'));
                if (!templateSnap.exists()) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-tools"></i>
                            <p>No tools configured yet.</p>
                            <p style="font-size:0.8rem;">Configure your Sales Hub in the admin panel.</p>
                        </div>`;
                    return;
                }
                renderTools(templateSnap.val());
                return;
            }

            renderTools(toolsSnap.val());
        } catch (error) {
            console.error('Error loading tools:', error);
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Error loading tools. Please try again.</p>
                </div>`;
        }
    }

    function renderTools(data) {
        const grid = document.getElementById('toolsGrid');
        let html = '';

        for (const [sectionId, tools] of Object.entries(data)) {
            for (const [toolId, tool] of Object.entries(tools)) {
                html += `
                    <div class="tool-card" onclick="openSheet('${encodeURIComponent(tool.sheetUrl || '')}', '${encodeURIComponent(tool.name || 'Tool')}')">
                        <div class="tool-header">
                            <div class="tool-icon">
                                <i class="${tool.icon || 'fas fa-tools'}"></i>
                            </div>
                            <div class="tool-info">
                                <h3>${tool.name || 'Tool'}</h3>
                                <span class="badge">${tool.badge || 'Active'}</span>
                            </div>
                        </div>
                        <p class="tool-description">${tool.description || 'No description'}</p>
                    </div>`;
            }
        }

        if (!html) {
            html = `
                <div class="empty-state">
                    <i class="fas fa-tools"></i>
                    <p>No tools configured yet.</p>
                    <p style="font-size:0.8rem;">Configure your Sales Hub in the admin panel.</p>
                </div>`;
        }

        grid.innerHTML = html;
    }

    // Open sheet viewer
    window.openSheet = (sheetUrl, sheetName) => {
        if (!sheetUrl) return;
        
        const sheetId = extractSheetId(sheetUrl);
        if (!sheetId) return;

        document.getElementById('sheetTitle').textContent = decodeURIComponent(sheetName);
        document.getElementById('sheetOverlay').classList.add('active');
        loadSheetInIframe(sheetId);
    };

    function extractSheetId(url) {
        const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        return match ? match[1] : null;
    }

    function loadSheetInIframe(sheetId) {
        const mode = currentEditMode ? 'edit' : 'preview';
        document.getElementById('sheetIframe').src = 
            `https://docs.google.com/spreadsheets/d/${sheetId}/${mode}?usp=sharing&rm=minimal`;
    }

    window.closeSheet = () => {
        document.getElementById('sheetOverlay').classList.remove('active');
        document.getElementById('sheetIframe').src = '';
    };

    window.toggleEditMode = () => {
        currentEditMode = !currentEditMode;
        const btn = document.getElementById('editToggleBtn');
        btn.innerHTML = currentEditMode ? 
            '<i class="fas fa-eye"></i> View' : 
            '<i class="fas fa-edit"></i> Edit';
        
        const currentUrl = document.getElementById('sheetIframe').src;
        if (currentUrl) {
            const sheetId = currentUrl.match(/\/d\/([a-zA-Z0-9-_]+)/)?.[1];
            if (sheetId) loadSheetInIframe(sheetId);
        }
    };

    window.reloadSheet = () => {
        const iframe = document.getElementById('sheetIframe');
        iframe.src = iframe.src;
    };

    // Greeting
    function setGreeting(name) {
        const hour = new Date().getHours();
        let greeting = 'Good ';
        if (hour < 12) greeting += 'morning';
        else if (hour < 17) greeting += 'afternoon';
        else greeting += 'evening';
        document.getElementById('greeting').textContent = 
            name ? `${greeting}, ${name}` : greeting;
    }

    // Auth
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = `index.html`;
            return;
        }

        const displayName = user.displayName || user.email?.split('@')[0] || 'User';
        document.getElementById('avatarInitials').textContent = displayName.substring(0, 2).toUpperCase();
        document.getElementById('dropdownName').textContent = displayName;
        document.getElementById('dropdownEmail').textContent = user.email;
        setGreeting(displayName.split(' ')[0]);

        // Get tenant from URL or user profile
        let activeTenant = tenantId;
        if (!activeTenant) {
            const userSnap = await get(ref(db, `users/${user.uid}/tenants`));
            if (userSnap.exists()) {
                activeTenant = Object.keys(userSnap.val())[0];
            }
        }

        if (activeTenant) {
            // Load tenant info
            const tenantSnap = await get(ref(db, `tenants/${activeTenant}/info`));
            if (tenantSnap.exists()) {
                document.getElementById('tenantBadge').textContent = tenantSnap.val().name || activeTenant;
            }
            loadTools(activeTenant);
        } else {
            document.getElementById('toolsGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-building"></i>
                    <p>No workspace found.</p>
                    <a href="workspace.html" class="btn btn-primary" style="display:inline-flex;margin-top:1rem;text-decoration:none;">
                        Go to Workspace
                    </a>
                </div>`;
        }
    });

    // ESC to close sheet
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            window.closeSheet();
        }
    });
</script>
</body>
</html>
