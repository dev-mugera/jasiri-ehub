<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasiri Suite | Sales Hub</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-900: #1a0a2e;
            --purple-800: #2d1154;
            --purple-700: #3d1a6e;
            --purple-600: #6B3BC2;
            --purple-500: #8B5CF6;
            --purple-400: #A78BFA;
            --purple-300: #C4B5FD;
            --purple-200: #DDD6FE;
            --purple-100: #EDE9FE;
            --purple-50: #F5F3FF;
            --white: #FFFFFF;
            --gray-50: #FAFAFA;
            --gray-100: #F5F5F5;
            --gray-200: #E5E5E5;
            --gray-300: #D4D4D4;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-900: #171717;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gradient-primary: linear-gradient(135deg, #6B3BC2 0%, #8B5CF6 100%);
            --gradient-dark: linear-gradient(135deg, #1a0a2e 0%, #2d1154 50%, #3d1a6e 100%);
            --sidebar-width: 280px;
            --topbar-height: 60px;
            --border-radius: 10px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sm: 0 1px 3px rgba(107, 59, 194, 0.08);
            --shadow-md: 0 4px 16px rgba(107, 59, 194, 0.12);
            --shadow-lg: 0 12px 40px rgba(107, 59, 194, 0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html { font-size: 14px; scroll-behavior: smooth; height: 100%; }

        body {
            background: var(--purple-50);
            color: var(--gray-900);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }

        .app-container { display: none; height: 100vh; width: 100%; max-width: 100vw; overflow: hidden; }

        /* Top Bar */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-height);
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 1000; border-bottom: 1px solid var(--purple-100); width: 100%;
        }
        .nav-left { display: flex; align-items: center; gap: 14px; }
        .menu-toggle { background: none; border: none; color: var(--gray-600); font-size: 17px; cursor: pointer; padding: 7px; border-radius: 5px; transition: var(--transition); display: none; }
        .menu-toggle:hover { color: var(--purple-600); background: var(--purple-50); }
        .back-btn { background: var(--purple-50); border: 1px solid var(--purple-100); color: var(--purple-600); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
        .back-btn:hover { background: var(--purple-100); }
        .brand-logo { display: flex; align-items: center; gap: 10px; }
        .brand-logo-icon { font-size: 18px; color: var(--purple-600); }
        .brand-text { font-size: 17px; font-weight: 700; color: var(--gray-900); }
        .brand-subtitle { font-size: 9px; color: var(--gray-500); margin-top: 1px; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .tenant-badge { font-size: 0.7rem; font-weight: 600; color: var(--purple-600); background: var(--purple-50); padding: 0.2rem 0.7rem; border-radius: 50px; border: 1px solid var(--purple-100); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 13px; cursor: pointer; }

        /* Sidebar */
        .sidebar {
            position: fixed; top: var(--topbar-height); left: 0;
            width: var(--sidebar-width); height: calc(100vh - var(--topbar-height));
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px);
            border-right: 1px solid var(--purple-100); padding: 20px 0;
            overflow-y: auto; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); z-index: 999;
        }
        .nav-section { padding: 0 18px; margin-bottom: 16px; }
        .nav-title { font-size: 10px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; padding-left: 6px; }
        .nav-section-title { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--gray-600); cursor: pointer; border-radius: 7px; transition: var(--transition); user-select: none; font-size: 13px; font-weight: 500; }
        .nav-section-title:hover { background: var(--purple-50); color: var(--purple-700); }
        .nav-section-title i { font-size: 14px; width: 18px; text-align: center; }
        .nav-submenu { list-style: none; padding: 5px 0 10px 0; margin: 0; display: none; }
        .nav-section.active .nav-submenu { display: block; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 44px; color: var(--gray-600); text-decoration: none; border-radius: 7px; margin-bottom: 2px; transition: var(--transition); border: 1px solid transparent; font-size: 12px; }
        .nav-link:hover { background: var(--purple-50); color: var(--purple-700); border-color: var(--purple-100); }
        .nav-link.active { background: var(--purple-100); color: var(--purple-700); border-color: var(--purple-200); }
        .nav-link i { font-size: 10px; width: 14px; text-align: center; }

        /* Main Content */
        .main-content { margin-left: var(--sidebar-width); margin-top: var(--topbar-height); height: calc(100vh - var(--topbar-height)); width: calc(100% - var(--sidebar-width)); transition: margin-left 0.25s; display: flex; flex-direction: column; overflow: hidden; }
        .content-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 24px; }
        .tools-section { flex: 1; display: block; }
        .tools-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .tools-title { font-size: 20px; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 8px; }
        .tools-title i { font-size: 18px; color: var(--purple-600); }

        /* Tools Grid */
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-bottom: 30px; }
        .tool-card { background: white; border-radius: 14px; padding: 22px; border: 1px solid var(--purple-100); transition: var(--transition); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; text-align: left; height: 100%; box-shadow: var(--shadow-sm); }
        .tool-card:hover { border-color: var(--purple-400); background: white; transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .tool-card::before { content: ''; height: 3px; background: var(--gradient-primary); border-radius: 3px 3px 0 0; margin: -22px -22px 16px -22px; }
        .tool-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .tool-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; background: var(--gradient-primary); }
        .tool-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--gray-900); }
        .tool-info p { font-size: 12px; color: var(--gray-500); }
        .tool-description { font-size: 13px; color: var(--gray-600); margin-bottom: 14px; line-height: 1.5; flex: 1; }
        .tool-badge { display: inline-block; padding: 4px 12px; background: var(--purple-50); color: var(--purple-600); border-radius: 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; border: 1px solid var(--purple-100); }

        /* Sheets Container */
        .sheets-container { position: fixed; top: var(--topbar-height); left: var(--sidebar-width); right: 0; bottom: 0; background: white; z-index: 998; display: none; flex-direction: column; transition: left 0.25s; padding: 20px; }
        .sheets-card { background: white; border-radius: 16px; border: 1px solid var(--purple-100); overflow: hidden; box-shadow: var(--shadow-md); display: flex; flex-direction: column; height: 100%; }
        .sheets-header { background: var(--purple-50); padding: 14px 22px; border-bottom: 1px solid var(--purple-100); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; flex-shrink: 0; }
        .sheets-title { font-size: 17px; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 10px; }
        .sheets-title i { color: var(--purple-600); }
        .sheets-controls { display: flex; gap: 8px; align-items: center; }
        .sheets-control-btn { background: white; color: var(--gray-600); border: 1px solid var(--purple-100); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 5px; }
        .sheets-control-btn:hover { background: var(--purple-50); color: var(--purple-700); }
        .sheets-control-btn.active { background: var(--purple-100); color: var(--purple-700); border-color: var(--purple-200); }
        .iframe-container { flex: 1; position: relative; background: white; overflow: hidden; display: flex; flex-direction: column; border-radius: 0 0 16px 16px; }
        #sheetIframe { flex: 1; width: 100%; height: 100%; border: none; display: block; }
        .sheet-loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; text-align: center; padding: 20px; }
        .sheet-loader-text { color: var(--purple-600); margin-top: 16px; font-size: 14px; font-weight: 500; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
        .loader { width: 40px; height: 40px; border: 4px solid var(--purple-100); border-top-color: var(--purple-600); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-spinner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 10003; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
        .loading-text { color: var(--purple-700); font-size: 14px; font-weight: 600; }

        /* Footer */
        .footer { margin-top: auto; padding: 20px 0 0 0; border-top: 1px solid var(--purple-100); text-align: center; color: var(--gray-500); font-size: 12px; width: 100%; flex-shrink: 0; }

        /* Responsive */
        @media (max-width: 1200px) { .sidebar { width: 240px; } .main-content { margin-left: 240px; width: calc(100% - 240px); } .sheets-container { left: 240px; } }
        @media (max-width: 992px) { .menu-toggle { display: block; } .sidebar { transform: translateX(-100%); width: 260px; } .sidebar.active { transform: translateX(0); box-shadow: 6px 0 30px rgba(0,0,0,0.1); } .main-content { margin-left: 0; width: 100%; } .sheets-container { left: 0; } }
        @media (max-width: 768px) { html { font-size: 13px; } .top-nav { padding: 0 16px; } .content-container { padding: 16px; } .tools-grid { grid-template-columns: 1fr; gap: 14px; } .tenant-badge { display: none; } }
        @media (max-width: 576px) { .sheets-controls { flex-wrap: wrap; justify-content: center; } }
    </style>
</head>
<body>

<!-- Loading Spinner -->
<div class="loading-spinner" id="loadingSpinner">
    <div class="loader"></div>
    <div class="loading-text">Loading Sales Hub...</div>
</div>

<!-- Workspace Container -->
<div class="app-container" id="appContainer">
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-left">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <a href="workspace.html" class="back-btn"><i class="fas fa-arrow-left"></i> Workspace</a>
            <div class="brand-logo">
                <div class="brand-logo-icon"><i class="fas fa-store"></i></div>
                <div>
                    <div class="brand-text">Sales Hub</div>
                    <div class="brand-subtitle">Enterprise Sales Management</div>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <span class="tenant-badge" id="tenantBadge">Loading...</span>
            <div class="user-avatar" id="userAvatar" onclick="toggleDropdown()"><span id="avatarInitials">U</span></div>
            <div id="userDropdown" style="display:none;position:absolute;top:56px;right:24px;background:white;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.15);border:1px solid var(--purple-100);min-width:200px;padding:8px;z-index:200;">
                <div style="padding:10px 14px;border-bottom:1px solid var(--purple-50);margin-bottom:4px;">
                    <div style="font-weight:700;font-size:13px;" id="dropdownName">User</div>
                    <div style="font-size:11px;color:var(--gray-500);" id="dropdownEmail">email</div>
                </div>
                <a href="workspace.html" style="display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--gray-700);text-decoration:none;font-size:13px;border-radius:8px;">🏠 Workspace</a>
                <a href="admin-emh.html" style="display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--gray-700);text-decoration:none;font-size:13px;border-radius:8px;">⚙️ Configure</a>
                <button onclick="handleSignOut()" style="display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--danger);background:none;border:none;width:100%;text-align:left;font-size:13px;cursor:pointer;border-radius:8px;margin-top:4px;border-top:1px solid var(--purple-50);font-family:'Inter',sans-serif;">🚪 Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="nav-section">
            <div class="nav-title">Sales Hub</div>
            <ul class="nav-submenu" style="display:block;">
                <li><a href="#" class="nav-link active" data-section="all"><i class="fas fa-th-large"></i> All Tools</a></li>
            </ul>
        </div>
        <div id="dynamicSidebarSections"></div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="content-container">
            <section class="tools-section" id="toolsSection">
                <div class="tools-header">
                    <h2 class="tools-title"><i class="fas fa-tools"></i> <span id="sectionTitle">Enterprise Tools</span></h2>
                </div>
                <div class="tools-grid" id="toolsGrid"></div>
                <footer class="footer">
                    <p>© <span id="year"></span> Jasiri Suite • Sales Hub</p>
                </footer>
            </section>
        </div>

        <!-- Sheets Container -->
        <div class="sheets-container" id="sheetsContainer">
            <div class="sheets-card">
                <div class="sheets-header">
                    <div class="sheets-title"><i class="fas fa-file-excel"></i> <span id="currentSheetTitle">Google Sheets</span></div>
                    <div class="sheets-controls">
                        <button class="sheets-control-btn" id="editModeBtn"><i class="fas fa-edit"></i> Edit</button>
                        <button class="sheets-control-btn active" id="viewModeBtn"><i class="fas fa-eye"></i> View</button>
                        <button class="sheets-control-btn" id="fullscreenBtn"><i class="fas fa-expand"></i> Fullscreen</button>
                        <button class="sheets-control-btn" id="refreshSheetBtn"><i class="fas fa-redo"></i> Refresh</button>
                        <button class="sheets-control-btn" id="closeSheetBtn"><i class="fas fa-times"></i> Close</button>
                    </div>
                </div>
                <div class="iframe-container">
                    <div class="sheet-loader" id="sheetLoader"><div class="loader"></div><div class="sheet-loader-text">Loading sheet...</div></div>
                    <iframe id="sheetIframe" loading="lazy" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC4GYjju0-ckHraZ3H5qR3MkID_BWoYQXk",
        authDomain: "jasiri-suite.firebaseapp.com",
        databaseURL: "https://jasiri-suite-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "jasiri-suite",
        storageBucket: "jasiri-suite.firebasestorage.app",
        messagingSenderId: "414625239065",
        appId: "1:414625239065:web:8cc055fd20d3d66a8e5a88"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const urlTenant = urlParams.get('tenant');

    let moduleData = {};
    let sectionCategories = {};
    let currentSheetId = '';
    let currentSheetName = '';
    let currentViewMode = 'view';
    let currentSection = 'all';
    let selectedTenant = '';

    // DOM refs
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menuToggle');
    const toolsGrid = document.getElementById('toolsGrid');
    const sheetsContainer = document.getElementById('sheetsContainer');
    const toolsSection = document.getElementById('toolsSection');
    const sheetIframe = document.getElementById('sheetIframe');
    const sheetLoader = document.getElementById('sheetLoader');
    const currentSheetTitle = document.getElementById('currentSheetTitle');
    const sectionTitle = document.getElementById('sectionTitle');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // Dropdown
    window.toggleDropdown = () => {
        const dd = document.getElementById('userDropdown');
        dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    };
    document.addEventListener('click', (e) => {
        const dd = document.getElementById('userDropdown');
        const av = document.getElementById('userAvatar');
        if (dd && av && !av.contains(e.target) && !dd.contains(e.target)) dd.style.display = 'none';
    });

    window.handleSignOut = async () => { await signOut(auth); window.location.href = 'index.html'; };

    // Load data
    async function loadData(tenantId) {
        showLoading();
        try {
            const sectionsSnap = await get(ref(db, `tenants/${tenantId}/apps/ehub/sections`));
            const catsSnap = await get(ref(db, `tenants/${tenantId}/apps/ehub/categories`));
            sectionCategories = catsSnap.val() || {};
            moduleData = {};
            const sections = sectionsSnap.val() || {};
            const promises = [];
            for (const [sid, section] of Object.entries(sections)) {
                moduleData[sid] = { title: section.title || sid, description: section.description || '', tools: [] };
                promises.push(get(ref(db, `tenants/${tenantId}/apps/ehub/tools/${sid}`)).then(snap => {
                    if (snap.exists()) moduleData[sid].tools = Object.values(snap.val());
                }));
            }
            await Promise.all(promises);
            
            // If no data, try template
            if (Object.keys(moduleData).length === 0) {
                const tSectionsSnap = await get(ref(db, 'templates/ehub/sections'));
                const tCatsSnap = await get(ref(db, 'templates/ehub/categories'));
                sectionCategories = tCatsSnap.val() || {};
                const tSections = tSectionsSnap.val() || {};
                for (const [sid, section] of Object.entries(tSections)) {
                    moduleData[sid] = { title: section.title || sid, description: section.description || '', tools: [] };
                }
                const tPromises = [];
                for (const sid of Object.keys(moduleData)) {
                    tPromises.push(get(ref(db, `templates/ehub/tools/${sid}`)).then(snap => {
                        if (snap.exists()) moduleData[sid].tools = Object.values(snap.val());
                    }));
                }
                await Promise.all(tPromises);
            }
            
            hideLoading();
            renderSidebar();
            renderTools();
        } catch (e) {
            hideLoading();
            console.error('Load error:', e);
        }
    }

    function renderSidebar() {
        const container = document.getElementById('dynamicSidebarSections');
        const cats = {};
        for (const [sid, s] of Object.entries(moduleData)) {
            const cat = sectionCategories[sid] || 'Other';
            if (!cats[cat]) cats[cat] = [];
            cats[cat].push({ sid, title: s.title, count: (s.tools||[]).length });
        }
        let html = '';
        for (const [cat, sections] of Object.entries(cats)) {
            html += `<div class="nav-section active"><div class="nav-section-title"><i class="fas fa-folder"></i><span>${cat}</span></div><ul class="nav-submenu">`;
            sections.forEach(s => {
                html += `<li><a href="#" class="nav-link ${currentSection === s.sid ? 'active' : ''}" data-section="${s.sid}"><i class="fas fa-chevron-right"></i> ${s.title} (${s.count})</a></li>`;
            });
            html += `</ul></div>`;
        }
        container.innerHTML = html;
        attachSidebarEvents();
    }

    function attachSidebarEvents() {
        document.querySelectorAll('.nav-section-title').forEach(t => {
            t.addEventListener('click', (e) => {
                const sec = e.currentTarget.parentElement;
                sec.classList.toggle('active');
            });
        });
        document.querySelectorAll('.nav-link[data-section]').forEach(l => {
            l.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
                l.classList.add('active');
                currentSection = l.dataset.section;
                renderTools();
                if (window.innerWidth <= 992) sidebar.classList.remove('active');
            });
        });
    }

    function renderTools() {
        let html = '';
        let hasTools = false;
        for (const [sid, s] of Object.entries(moduleData)) {
            if (currentSection !== 'all' && currentSection !== sid) continue;
            sectionTitle.textContent = currentSection !== 'all' ? s.title : 'All Enterprise Tools';
            if (s.tools) {
                s.tools.forEach(t => {
                    hasTools = true;
                    html += `
                    <div class="tool-card" onclick="openSheet('${t.sheetUrl||''}','${t.name||'Tool'}','${s.title}')">
                        <div class="tool-header">
                            <div class="tool-icon"><i class="${t.icon||'fas fa-tools'}"></i></div>
                            <div class="tool-info"><h3>${t.name}</h3><p><span class="tool-badge">${t.badge||'Active'}</span></p></div>
                        </div>
                        <p class="tool-description">${t.description||'No description'}</p>
                    </div>`;
                });
            }
        }
        toolsGrid.innerHTML = hasTools ? html : `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--gray-500);"><i class="fas fa-tools" style="font-size:48px;margin-bottom:16px;opacity:0.4;"></i><p>No tools configured yet. Use the admin panel to add tools.</p><a href="admin-emh.html?tenant=${selectedTenant}" style="display:inline-flex;margin-top:12px;padding:10px 20px;background:var(--gradient-primary);color:white;border-radius:8px;text-decoration:none;font-weight:600;">⚙️ Configure Sales Hub</a></div>`;
    }

    // Sheet functions
    window.openSheet = (url, name, section) => {
        if (!url) return;
        const id = extractSheetId(url);
        if (!id) return;
        currentSheetId = id;
        currentSheetName = name;
        currentSheetTitle.textContent = `${section} - ${name}`;
        toolsSection.style.display = 'none';
        sheetsContainer.style.display = 'flex';
        loadSheet();
    };

    function extractSheetId(url) {
        const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        return m ? m[1] : null;
    }

    function loadSheet() {
        sheetLoader.style.display = 'flex';
        const mode = currentViewMode === 'edit' ? 'edit' : 'preview';
        sheetIframe.src = `https://docs.google.com/spreadsheets/d/${currentSheetId}/${mode}?usp=sharing&rm=minimal`;
    }

    sheetIframe.addEventListener('load', () => { sheetLoader.style.display = 'none'; });
    sheetIframe.addEventListener('error', () => { sheetLoader.style.display = 'none'; });

    document.getElementById('closeSheetBtn').addEventListener('click', () => {
        sheetsContainer.style.display = 'none';
        toolsSection.style.display = 'block';
        sheetIframe.src = '';
    });

    document.getElementById('editModeBtn').addEventListener('click', () => { currentViewMode = 'edit'; document.getElementById('editModeBtn').classList.add('active'); document.getElementById('viewModeBtn').classList.remove('active'); loadSheet(); });
    document.getElementById('viewModeBtn').addEventListener('click', () => { currentViewMode = 'view'; document.getElementById('viewModeBtn').classList.add('active'); document.getElementById('editModeBtn').classList.remove('active'); loadSheet(); });
    document.getElementById('refreshSheetBtn').addEventListener('click', loadSheet);
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
        const c = sheetIframe.parentElement;
        if (!document.fullscreenElement) c.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
    });

    menuToggle.addEventListener('click', () => sidebar.classList.toggle('active'));
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 992 && !sidebar.contains(e.target) && !menuToggle.contains(e.target) && sidebar.classList.contains('active')) {
            sidebar.classList.remove('active');
        }
    });

    function showLoading() { loadingSpinner.style.display = 'flex'; }
    function hideLoading() { loadingSpinner.style.display = 'none'; }

    document.getElementById('year').textContent = new Date().getFullYear();

    // Auth
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'index.html'; return; }

        const dn = user.displayName || user.email?.split('@')[0] || 'User';
        document.getElementById('avatarInitials').textContent = dn.substring(0,2).toUpperCase();
        document.getElementById('dropdownName').textContent = dn;
        document.getElementById('dropdownEmail').textContent = user.email;

        if (urlTenant) {
            selectedTenant = urlTenant;
        } else {
            const us = await get(ref(db, `users/${user.uid}/tenants`));
            if (us.exists()) selectedTenant = Object.keys(us.val())[0];
        }

        if (selectedTenant) {
            const ts = await get(ref(db, `tenants/${selectedTenant}/info`));
            document.getElementById('tenantBadge').textContent = ts.exists() ? ts.val().name : selectedTenant;
            loadData(selectedTenant);
        }

        document.getElementById('appContainer').style.display = 'block';
    });
</script>
</body>
</html>
