<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasiri Suite | Manage Templates</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --purple-600: #6B3BC2; --purple-500: #8B5CF6; --purple-400: #A78BFA;
            --purple-100: #EDE9FE; --purple-50: #F5F3FF; --white: #FFFFFF;
            --gray-50: #FAFAFA; --gray-100: #F5F5F5; --gray-200: #E5E5E5;
            --gray-500: #737373; --gray-600: #525252; --gray-700: #404040;
            --gray-900: #171717; --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
            --gradient-primary: linear-gradient(135deg, #6B3BC2 0%, #8B5CF6 100%);
            --shadow-sm: 0 1px 3px rgba(107, 59, 194, 0.08);
            --shadow-md: 0 4px 16px rgba(107, 59, 194, 0.12);
            --shadow-lg: 0 12px 40px rgba(107, 59, 194, 0.18);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background: var(--purple-50); color: var(--gray-900); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .topbar {
            background: white; border-bottom: 1px solid var(--purple-100);
            padding: 0 1.5rem; height: 56px; display: flex;
            align-items: center; justify-content: space-between;
        }
        .topbar-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid var(--purple-100); background: white;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--gray-700); transition: all 0.2s; text-decoration: none;
        }
        .back-btn:hover { background: var(--purple-50); border-color: var(--purple-300); color: var(--purple-600); }

        .page-header {
            background: white; border-radius: 16px; padding: 24px; margin-bottom: 24px;
            border: 1px solid var(--purple-100); box-shadow: var(--shadow-sm);
            display: flex; justify-content: space-between; align-items: center;
        }
        .page-header h1 { font-size: 22px; font-weight: 800; }

        .btn {
            padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
            cursor: pointer; border: 1px solid var(--purple-100); background: white;
            color: var(--gray-700); transition: all 0.2s; display: inline-flex;
            align-items: center; gap: 6px; font-family: 'Inter', sans-serif; text-decoration: none;
        }
        .btn:hover { background: var(--purple-50); border-color: var(--purple-300); }
        .btn-primary { background: var(--gradient-primary); color: white; border-color: transparent; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { color: var(--danger); border-color: #FECACA; }
        .btn-danger:hover { background: #FEF2F2; }
        .btn-success { background: var(--success); color: white; border-color: transparent; }

        .templates-table {
            background: white; border-radius: 16px; overflow: hidden;
            border: 1px solid var(--purple-100); box-shadow: var(--shadow-sm);
        }
        .table-header {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 120px;
            padding: 14px 20px; background: var(--purple-50); font-size: 12px;
            font-weight: 700; color: var(--gray-700);
        }
        .table-row {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 120px;
            padding: 14px 20px; border-top: 1px solid var(--purple-50);
            align-items: center; font-size: 13px;
        }
        .table-row:hover { background: var(--purple-50); }
        .actions { display: flex; gap: 6px; }
        .actions .btn { padding: 4px 8px; font-size: 11px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 20px; padding: 28px; max-width: 550px;
            width: 90%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--gray-700); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 2px solid var(--purple-100);
            border-radius: 10px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--purple-400); }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: white; border: 1px solid var(--purple-100); border-radius: 10px; padding: 14px 22px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); transform: translateX(120%); transition: transform 0.3s ease; z-index: 2000; }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast i { font-size: 18px; color: var(--success); }

        @media (max-width: 768px) {
            .table-header, .table-row { grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px; }
            .table-header span:nth-child(3), .table-header span:nth-child(4),
            .table-row span:nth-child(3), .table-row span:nth-child(4) { display: none; }
            .actions { grid-column: span 2; justify-content: flex-end; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <a href="templates.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="app-title"><h1>📋 Manage Templates</h1></div>
    </div>
    <div>
        <a href="templates.html" class="btn"><i class="fas fa-eye"></i> View Gallery</a>
        <button class="btn btn-danger" onclick="handleSignOut()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <h1>Sheet Templates Admin</h1>
        <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> Add Template</button>
    </div>

    <div class="templates-table">
        <div class="table-header">
            <span>Template Name</span>
            <span>App</span>
            <span>Category</span>
            <span>Views</span>
            <span>Actions</span>
        </div>
        <div id="templatesList">
            <div class="table-row"><span colspan="5" style="text-align:center;color:var(--gray-500);">Loading...</span></div>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="templateModal">
    <div class="modal">
        <h2 id="modalTitle">Add Template</h2>
        <form onsubmit="return false;">
            <input type="hidden" id="editTemplateId">
            <div class="form-group"><label>Template Name</label><input type="text" id="templateName" required></div>
            <div class="form-group"><label>Description</label><textarea id="templateDesc"></textarea></div>
            <div class="form-group"><label>App</label>
                <select id="templateApp">
                    <option value="emh">Sales Hub</option>
                    <option value="erh">Resource Hub</option>
                    <option value="efh">Finance Hub</option>
                    <option value="efs">Fleet Hub</option>
                    <option value="talents">Talents Hub</option>
                </select>
            </div>
            <div class="form-group"><label>Category</label><input type="text" id="templateCategory" placeholder="e.g., Sales Reports"></div>
            <div class="form-group"><label>Google Sheet URL</label><input type="url" id="templateUrl" placeholder="https://docs.google.com/spreadsheets/d/..." required></div>
            <div class="modal-actions">
                <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveTemplate()">Save Template</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage"></span></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC4GYjju0-ckHraZ3H5qR3MkID_BWoYQXk",
        authDomain: "jasiri-suite.firebaseapp.com",
        databaseURL: "https://jasiri-suite-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "jasiri-suite",
        storageBucket: "jasiri-suite.firebasestorage.app",
        messagingSenderId: "414625239065",
        appId: "1:414625239065:web:8cc055fd20d3d66a8e5a88"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let allTemplates = {};
    let editingId = null;

    window.handleSignOut = async () => { await signOut(auth); window.location.href = 'index.html'; };

    function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toastMessage').textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

    async function loadTemplates() {
        const snap = await get(ref(db, 'templates/sheets'));
        allTemplates = snap.val() || {};
        renderList();
    }

    function renderList() {
        const list = document.getElementById('templatesList');
        const entries = Object.entries(allTemplates);
        const appNames = { emh: 'Sales Hub', erh: 'Resource Hub', efh: 'Finance Hub', efs: 'Fleet Hub', talents: 'Talents Hub' };

        if (entries.length === 0) {
            list.innerHTML = '<div class="table-row"><span colspan="5" style="text-align:center;color:var(--gray-500);">No templates yet</span></div>';
            return;
        }

        list.innerHTML = entries.map(([id, t]) => `
            <div class="table-row">
                <span><strong>${t.name}</strong></span>
                <span>${appNames[t.app] || t.app}</span>
                <span>${t.category || '-'}</span>
                <span>${t.views || 0}</span>
                <div class="actions">
                    <button class="btn" onclick="editTemplate('${id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger" onclick="deleteTemplate('${id}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `).join('');
    }

    window.openAddModal = () => {
        editingId = null;
        document.getElementById('modalTitle').textContent = 'Add Template';
        document.getElementById('editTemplateId').value = '';
        document.getElementById('templateName').value = '';
        document.getElementById('templateDesc').value = '';
        document.getElementById('templateCategory').value = '';
        document.getElementById('templateUrl').value = '';
        document.getElementById('templateApp').value = 'emh';
        document.getElementById('templateModal').classList.add('active');
    };

    window.editTemplate = (id) => {
        const t = allTemplates[id];
        if (!t) return;
        editingId = id;
        document.getElementById('modalTitle').textContent = 'Edit Template';
        document.getElementById('editTemplateId').value = id;
        document.getElementById('templateName').value = t.name || '';
        document.getElementById('templateDesc').value = t.description || '';
        document.getElementById('templateCategory').value = t.category || '';
        document.getElementById('templateUrl').value = t.sheetUrl || '';
        document.getElementById('templateApp').value = t.app || 'emh';
        document.getElementById('templateModal').classList.add('active');
    };

    window.saveTemplate = async () => {
        const name = document.getElementById('templateName').value.trim();
        const url = document.getElementById('templateUrl').value.trim();
        if (!name || !url) { showToast('Name and URL required'); return; }

        const id = editingId || 'tpl_' + Date.now().toString(36);
        const data = {
            id, name,
            description: document.getElementById('templateDesc').value.trim(),
            category: document.getElementById('templateCategory').value.trim(),
            app: document.getElementById('templateApp').value,
            sheetUrl: url,
            views: editingId ? (allTemplates[editingId]?.views || 0) : 0,
            updatedAt: new Date().toISOString()
        };
        if (!editingId) { data.createdAt = new Date().toISOString(); }

        await set(ref(db, `templates/sheets/${id}`), data);
        closeModal();
        loadTemplates();
        showToast(editingId ? 'Template updated!' : 'Template added!');
    };

    window.deleteTemplate = async (id) => {
        if (!confirm('Delete this template?')) return;
        await set(ref(db, `templates/sheets/${id}`), null);
        loadTemplates();
        showToast('Template deleted');
    };

    window.closeModal = () => { document.getElementById('templateModal').classList.remove('active'); };
    document.addEventListener('click', (e) => { if (e.target.classList.contains('modal-overlay')) closeModal(); });

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'index.html'; return; }
        const adminSnap = await get(ref(db, `admins/${user.uid}`));
        if (!adminSnap.exists()) { window.location.href = 'workspace.html'; return; }
        loadTemplates();
    });
</script>
</body>
</html>
