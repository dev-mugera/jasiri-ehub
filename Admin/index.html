<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasiri Suite | Admin Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --purple-900: #1a0a2e;
            --purple-800: #2d1154;
            --purple-700: #3d1a6e;
            --purple-600: #6B3BC2;
            --purple-500: #8B5CF6;
            --purple-400: #A78BFA;
            --purple-300: #C4B5FD;
            --purple-200: #DDD6FE;
            --purple-100: #EDE9FE;
            --purple-50: #F5F3FF;
            --white: #FFFFFF;
            --gray-100: #F8F9FA;
            --gray-200: #E9ECEF;
            --gray-300: #DEE2E6;
            --gray-500: #ADB5BD;
            --gray-600: #6C757D;
            --gray-700: #495057;
            --gray-900: #212529;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gradient-primary: linear-gradient(135deg, #6B3BC2 0%, #8B5CF6 100%);
            --shadow-sm: 0 1px 3px rgba(107, 59, 194, 0.08);
            --shadow-md: 0 4px 16px rgba(107, 59, 194, 0.12);
            --shadow-lg: 0 12px 40px rgba(107, 59, 194, 0.18);
            --shadow-xl: 0 20px 60px rgba(107, 59, 194, 0.22);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(180deg, var(--purple-50) 0%, var(--white) 100%);
            color: var(--gray-900);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* Login */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 10, 46, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .login-card {
            background: white; border-radius: 20px; padding: 40px;
            max-width: 420px; width: 90%; text-align: center; box-shadow: var(--shadow-xl);
        }
        .login-icon {
            width: 64px; height: 64px; background: var(--gradient-primary);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 28px; color: white;
        }
        .login-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .login-card > p { font-size: 13px; color: var(--gray-600); margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--gray-700); }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 2px solid var(--purple-100);
            border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none;
        }
        .form-group input:focus { border-color: var(--purple-500); }
        .login-btn {
            width: 100%; padding: 13px; background: var(--gradient-primary);
            color: white; border: none; border-radius: 10px; font-size: 15px;
            font-weight: 700; cursor: pointer; margin-top: 8px; font-family: 'Inter', sans-serif;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-error { background: #FEE2E2; color: var(--danger); font-size: 12px; padding: 10px; border-radius: 8px; margin-top: 14px; display: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Header */
        .admin-header {
            background: white; border-radius: 16px; padding: 24px 28px;
            margin-bottom: 24px; border: 1px solid var(--purple-100); box-shadow: var(--shadow-sm);
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header-title { display: flex; align-items: center; gap: 14px; }
        .header-icon {
            width: 48px; height: 48px; background: var(--gradient-primary);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: white;
        }
        .header-title h1 { font-size: 24px; font-weight: 800; }
        .header-subtitle { font-size: 12px; color: var(--gray-600); margin-top: 3px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn {
            padding: 9px 16px; border-radius: 10px; border: 1px solid var(--purple-100);
            background: white; color: var(--gray-700); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 7px;
            text-decoration: none; font-family: 'Inter', sans-serif;
        }
        .btn:hover { background: var(--purple-50); border-color: var(--purple-300); }
        .btn-primary { background: var(--gradient-primary); color: white; border-color: transparent; }
        .btn-primary:hover { background: var(--purple-500); box-shadow: var(--shadow-md); }
        .btn-danger { background: white; border-color: #FECACA; color: var(--danger); }
        .btn-danger:hover { background: #FEF2F2; border-color: var(--danger); }

        /* Tenant Selector (Super Admin only) */
        .tenant-selector {
            background: white; border-radius: 14px; padding: 16px 20px;
            margin-bottom: 24px; border: 1px solid var(--purple-100);
            display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm);
        }
        .tenant-selector label { font-size: 13px; font-weight: 600; color: var(--gray-700); white-space: nowrap; }
        .tenant-selector select {
            flex: 1; padding: 8px 14px; border: 2px solid var(--purple-100);
            border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif;
            color: var(--gray-900); outline: none; cursor: pointer;
        }
        .selected-tenant-info {
            font-size: 12px; color: var(--purple-600); font-weight: 600;
            background: var(--purple-50); padding: 6px 14px; border-radius: 20px; white-space: nowrap;
        }

        /* Stats */
        .stats-summary {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px; margin-bottom: 24px;
        }
        .stat-card {
            background: white; border-radius: 14px; padding: 18px;
            border: 1px solid var(--purple-100); display: flex; align-items: center;
            gap: 12px; box-shadow: var(--shadow-sm);
        }
        .stat-icon {
            width: 42px; height: 42px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 17px;
            background: var(--purple-50); color: var(--purple-600);
        }
        .stat-info h3 { font-size: 20px; font-weight: 800; }
        .stat-info p { font-size: 11px; color: var(--gray-600); margin-top: 2px; }

        /* Admin Cards */
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; margin-bottom: 24px; }
        .admin-card {
            background: white; border-radius: 16px; padding: 22px;
            border: 1px solid var(--purple-100); transition: all 0.3s cubic-bezier(0.2, 0.8, 0.4, 1);
            position: relative; overflow: hidden; text-decoration: none;
            color: var(--gray-900); display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
        }
        .admin-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; transition: height 0.3s ease; }
        .admin-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-xl); border-color: transparent; }
        .admin-card:hover::before { height: 5px; }
        .admin-card.emh::before { background: linear-gradient(90deg, #6B3BC2, #A78BFA); }
        .admin-card.erh::before { background: linear-gradient(90deg, #EC4899, #F472B6); }
        .admin-card.efh::before { background: linear-gradient(90deg, #F59E0B, #FBBF24); }
        .admin-card.efs::before { background: linear-gradient(90deg, #10B981, #34D399); }
        .admin-card.talents::before { background: linear-gradient(90deg, #F97316, #FB923C); }
        .admin-card.emh:hover { box-shadow: 0 15px 40px rgba(107, 59, 194, 0.2); }
        .admin-card.erh:hover { box-shadow: 0 15px 40px rgba(236, 72, 153, 0.2); }
        .admin-card.efh:hover { box-shadow: 0 15px 40px rgba(245, 158, 11, 0.2); }
        .admin-card.efs:hover { box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2); }
        .admin-card.talents:hover { box-shadow: 0 15px 40px rgba(249, 115, 22, 0.2); }

        .card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
        .card-icon {
            width: 50px; height: 50px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
        }
        .card-icon.emh { background: #EDE9FE; color: #6B3BC2; }
        .card-icon.erh { background: #FCE7F3; color: #EC4899; }
        .card-icon.efh { background: #FEF3C7; color: #F59E0B; }
        .card-icon.efs { background: #D1FAE5; color: #10B981; }
        .card-icon.talents { background: #FFEDD5; color: #F97316; }
        .card-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
        .card-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
        .badge-active { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
        .badge-pending { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
        .card-description { font-size: 13px; color: var(--gray-600); line-height: 1.5; margin-bottom: 14px; flex: 1; }
        .card-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--gray-500); padding-top: 12px;
            border-top: 1px solid var(--purple-50);
        }
        .card-meta span { display: flex; align-items: center; gap: 5px; }
        .card-arrow { font-size: 16px; color: var(--purple-500); transition: transform 0.3s ease; }
        .admin-card:hover .card-arrow { transform: translateX(4px); }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: white; border: 1px solid var(--purple-100);
            border-radius: 10px; padding: 14px 22px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: var(--shadow-lg); transform: translateX(120%);
            transition: transform 0.3s ease; z-index: 1000;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.success i { color: var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.error i { color: var(--danger); }
        .toast i { font-size: 18px; }

        .admin-footer { text-align: center; padding: 20px; color: var(--gray-500); font-size: 12px; }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .header-content { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; flex-wrap: wrap; }
            .admin-grid { grid-template-columns: 1fr; }
            .tenant-selector { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-shield-halved"></i></div>
        <h2>Admin Access</h2>
        <p>Sign in to manage your business tools</p>
        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn" onclick="handleLogin()">
                <i class="fas fa-lock"></i> Sign In
            </button>
            <div class="login-error" id="loginError"></div>
        </form>
    </div>
</div>

<!-- Main Content -->
<div class="container" id="mainContent" style="display: none;">
    <!-- Header -->
    <div class="admin-header">
        <div class="header-content">
            <div class="header-title">
                <div class="header-icon"><i class="fas fa-shield-halved"></i></div>
                <div>
                    <h1 id="pageTitle">Admin Hub</h1>
                    <p class="header-subtitle" id="headerSubtitle">Manage your business tools</p>
                </div>
            </div>
            <div class="header-actions">
                <a href="workspace.html" class="btn"><i class="fas fa-th-large"></i> Workspace</a>
                <button class="btn btn-primary" onclick="syncAll()"><i class="fas fa-sync-alt"></i> Sync</button>
                <button class="btn btn-danger" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
            </div>
        </div>
    </div>

    <!-- Tenant Selector (SUPER ADMIN ONLY) -->
    <div class="tenant-selector" id="tenantSelectorContainer" style="display: none;">
        <label><i class="fas fa-building"></i> Select Tenant:</label>
        <select id="tenantSelector" onchange="switchTenant(this.value)"></select>
        <span class="selected-tenant-info" id="selectedTenantInfo"><i class="fas fa-globe"></i> All Tenants</span>
    </div>

    <!-- Tenant Info (TENANT ADMIN) -->
    <div id="tenantInfoBanner" style="display:none; background:white; border-radius:14px; padding:14px 20px; margin-bottom:24px; border:1px solid var(--purple-100); box-shadow:var(--shadow-sm);">
        <span style="font-size:13px;font-weight:600;">🏢 Managing: <strong id="tenantNameDisplay"></strong></span>
        <span style="margin-left:12px;font-size:12px;color:var(--purple-600);">Plan: <strong id="tenantPlanDisplay"></strong></span>
        <span style="margin-left:12px;font-size:12px;color:var(--gray-500);">Role: <strong id="tenantRoleDisplay"></strong></span>
    </div>

    <!-- Stats -->
    <div class="stats-summary">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-layer-group"></i></div><div class="stat-info"><h3>5</h3><p>Total Apps</p></div></div>
        <div class="stat-card" id="tenantsStatCard"><div class="stat-icon"><i class="fas fa-building"></i></div><div class="stat-info"><h3 id="totalTenants">-</h3><p>Tenants</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-folder"></i></div><div class="stat-info"><h3 id="totalSections">-</h3><p>Sections</p></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-tools"></i></div><div class="stat-info"><h3 id="totalTools">-</h3><p>Tools</p></div></div>
    </div>

    <!-- Admin Cards Grid -->
    <div class="admin-grid" id="adminGrid"></div>

    <div class="admin-footer"><p>&copy; 2026 Jasiri Suite — Admin Hub</p></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMessage"></span></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC4GYjju0-ckHraZ3H5qR3MkID_BWoYQXk",
        authDomain: "jasiri-suite.firebaseapp.com",
        databaseURL: "https://jasiri-suite-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "jasiri-suite",
        storageBucket: "jasiri-suite.firebasestorage.app",
        messagingSenderId: "414625239065",
        appId: "1:414625239065:web:8cc055fd20d3d66a8e5a88"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let isSuperAdmin = false;
    let currentUser = null;
    let activeTenantId = '';
    let userTenants = {};
    let allTenantsData = {};
    let tenantSubscription = null;
    let userRole = '';

    // ============ LOGIN ============
    window.handleLogin = async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('loginError');
        errorDiv.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Signing in...';
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
            errorDiv.textContent = e.message;
            errorDiv.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock"></i> Sign In';
        }
    };

    window.handleLogout = async () => { await signOut(auth); window.location.href = 'index.html'; };

    window.switchTenant = (tid) => {
        activeTenantId = tid;
        if (tid) {
            document.getElementById('selectedTenantInfo').innerHTML = `<i class="fas fa-building"></i> ${allTenantsData[tid]?.info?.name || tid}`;
            tenantSubscription = allTenantsData[tid]?.subscription || { plan: 'free', limits: { features: {} } };
        } else {
            document.getElementById('selectedTenantInfo').innerHTML = '<i class="fas fa-globe"></i> All Tenants';
            tenantSubscription = { plan: 'enterprise', limits: { features: { allHubs: true } } };
        }
        renderAdminCards();
    };

    window.syncAll = () => { loadData(); showToast('Synced', 'success'); };

    // ============ LOAD DATA ============
    async function loadData() {
        if (isSuperAdmin) {
            // Load all tenants
            const snap = await get(ref(db, 'tenants'));
            allTenantsData = snap.val() || {};
            const selector = document.getElementById('tenantSelector');
            selector.innerHTML = '<option value="">All Tenants (Global)</option>';
            for (const [id, t] of Object.entries(allTenantsData)) {
                selector.innerHTML += `<option value="${id}">${t.info?.name || id} (${t.subscription?.plan || 'free'})</option>`;
            }
            document.getElementById('totalTenants').textContent = Object.keys(allTenantsData).length;
            document.getElementById('tenantsStatCard').style.display = 'flex';
            activeTenantId = '';
            tenantSubscription = { plan: 'enterprise', limits: { features: { allHubs: true } } };
        } else {
            // Tenant admin - only their own data
            document.getElementById('tenantsStatCard').style.display = 'none';
            document.getElementById('totalTenants').textContent = '1';
            if (activeTenantId) {
                const tSnap = await get(ref(db, `tenants/${activeTenantId}`));
                if (tSnap.exists()) {
                    const tData = tSnap.val();
                    tenantSubscription = tData.subscription || { plan: 'free', limits: { features: {} } };
                    document.getElementById('tenantNameDisplay').textContent = tData.info?.name || activeTenantId;
                    document.getElementById('tenantPlanDisplay').textContent = (tenantSubscription.plan || 'free').toUpperCase();
                    document.getElementById('tenantRoleDisplay').textContent = userRole;
                    document.getElementById('tenantInfoBanner').style.display = 'block';
                }
            }
        }

        // Count tools
        let totalTools = 0, totalSections = 0;
        const apps = ['ehub', 'erh', 'efh', 'efs', 'talents'];
        for (const app of apps) {
            const ts = await get(ref(db, `templates/${app}/tools`));
            if (ts.exists()) for (const s of Object.values(ts.val())) totalTools += Object.keys(s).length;
            const ss = await get(ref(db, `templates/${app}/sections`));
            if (ss.exists()) totalSections += Object.keys(ss.val()).length;
        }
        document.getElementById('totalTools').textContent = totalTools || '-';
        document.getElementById('totalSections').textContent = totalSections || '-';
        renderAdminCards();
    }

    // ============ RENDER CARDS ============
    function renderAdminCards() {
        const plan = tenantSubscription?.plan || 'free';
        const features = tenantSubscription?.limits?.features || {};
        const basePath = activeTenantId ? `?tenant=${activeTenantId}` : '';

        const apps = [
            { id: 'emh', name: 'Sales Hub', icon: 'fa-store', colorClass: 'emh', desc: 'POS tools, sales sections & sheets.', link: `admin-emh.html${basePath}` },
            { id: 'erh', name: 'Resource Hub', icon: 'fa-users-cog', colorClass: 'erh', desc: 'HR, assets & project coordination.', link: `admin-erh.html${basePath}` },
            { id: 'efh', name: 'Finance Hub', icon: 'fa-chart-pie', colorClass: 'efh', desc: 'Accounting, reports & budgets.', link: `admin-efh.html${basePath}` },
            { id: 'efs', name: 'Fleet Hub', icon: 'fa-truck', colorClass: 'efs', desc: 'Logistics, courier & fleet.', link: `admin-efs.html${basePath}` },
            { id: 'talents', name: 'Talents Hub', icon: 'fa-graduation-cap', colorClass: 'talents', desc: 'HR, learning & development.', link: `admin-talents.html${basePath}` }
        ];

        document.getElementById('adminGrid').innerHTML = apps.map(app => {
            const hasAccess = isSuperAdmin || features[app.id] === true || plan === 'enterprise';
            const isLocked = !hasAccess;
            return `
                <a href="${isLocked ? '#' : app.link}" class="admin-card ${app.colorClass}"
                   ${isLocked ? `onclick="showToast('${app.name} requires Pro or Enterprise plan. Current: ${plan.toUpperCase()}', 'error'); return false;"` : ''}
                   style="${isLocked ? 'opacity:0.6;' : ''}">
                    <div class="card-header">
                        <div class="card-icon ${app.colorClass}"><i class="fas ${app.icon}"></i></div>
                        <div class="card-info">
                            <h3>${app.name} Admin</h3>
                            <span class="card-badge ${hasAccess ? 'badge-active' : 'badge-pending'}">${hasAccess ? 'Active' : 'Upgrade'}</span>
                        </div>
                    </div>
                    <p class="card-description">${app.desc}</p>
                    <div class="card-meta">
                        <span><i class="fas ${isLocked ? 'fa-lock' : 'fa-check-circle'}" style="color:${isLocked ? 'var(--danger)' : 'var(--success)'};"></i> ${isLocked ? `${plan.toUpperCase()} Plan Required` : 'Full Access'}</span>
                        <i class="fas fa-arrow-right card-arrow"></i>
                    </div>
                </a>`;
        }).join('');
    }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        t.className = `toast ${type} show`;
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ============ AUTH ============
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
            return;
        }
        currentUser = user;
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        // Check if super admin
        const adminSnap = await get(ref(db, `admins/${user.uid}`));
        
        if (adminSnap.exists()) {
            // SUPER ADMIN
            isSuperAdmin = true;
            userRole = 'super_admin';
            document.getElementById('pageTitle').textContent = 'Super Admin Hub';
            document.getElementById('headerSubtitle').textContent = `Super Admin: ${user.email}`;
            document.getElementById('tenantSelectorContainer').style.display = 'flex';
            document.getElementById('tenantInfoBanner').style.display = 'none';
        } else {
            // TENANT USER - check their tenant membership
            isSuperAdmin = false;
            const userSnap = await get(ref(db, `users/${user.uid}/tenants`));
            
            if (!userSnap.exists()) {
                showToast('No workspace found. Please create an account.', 'error');
                return;
            }

            userTenants = userSnap.val();
            activeTenantId = Object.keys(userTenants)[0];
            userRole = userTenants[activeTenantId];

            // Check if user is owner or admin
            if (userRole !== 'owner' && userRole !== 'admin') {
                showToast('Admin access required. You are a ' + userRole + '.', 'error');
                document.getElementById('adminGrid').innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--gray-500);">
                        <i class="fas fa-lock" style="font-size:48px;margin-bottom:16px;opacity:0.4;"></i>
                        <h3>Admin Access Required</h3>
                        <p>Only owners and admins can access this panel.</p>
                        <a href="workspace.html" class="btn btn-primary" style="display:inline-flex;margin-top:16px;text-decoration:none;">Go to Workspace</a>
                    </div>`;
                return;
            }

            document.getElementById('pageTitle').textContent = 'Admin Hub';
            document.getElementById('headerSubtitle').textContent = `Managing your business • ${user.email}`;
            document.getElementById('tenantSelectorContainer').style.display = 'none';
            document.getElementById('tenantInfoBanner').style.display = 'block';
        }

        loadData();
    });

    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'none';
</script>
</body>
</html>
